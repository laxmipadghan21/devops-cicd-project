apiVersion: apps/v1

kind: Deployment

metadata:
  name: devops-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-cicd-app

  template:
    metadata:
      labels:
        app: devops-cicd-app

    spec:
      containers:
        - name: devops-cicd-container
          image: laxmipadghan21/devops-cicd-app:1.0
          ports:
            - containerPort: 5000